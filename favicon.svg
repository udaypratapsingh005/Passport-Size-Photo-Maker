<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gen Z Electric Gradient Background -->
    <linearGradient id="genzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Hyper Neon Accent Gradient -->
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Bright Flash Star Gradient -->
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Intense Neon Shadow -->
    <filter id="neonGlowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F5D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Rounded Card Base -->
  <rect x="25" y="25" width="450" height="450" rx="100" fill="url(#genzBg)" filter="url(#neonGlowEffect)" />
  <rect x="27" y="27" width="446" height="446" rx="98" fill="none" stroke="url(#neonPulse)" stroke-width="4" opacity="0.6" />

  <!-- Dynamic Camera Viewfinder Focus Edges -->
  <path d="M 90 150 L 90 90 L 150 90" stroke="#00F5D4" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 410 150 L 410 90 L 350 90" stroke="#00F5D4" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 90 350 L 90 410 L 150 410" stroke="#00F5D4" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 410 350 L 410 410 L 350 410" stroke="#00F5D4" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Central Passport Frame Overlay -->
  <rect x="140" y="130" width="220" height="260" rx="36" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Modern Gen Z Avatar Graphic -->
  <circle cx="250" cy="215" r="48" fill="#FFFFFF" />
  <!-- Stylish Sunglasses / Cyber Goggles Detail -->
  <path d="M 210 205 Q 250 215 290 205 Q 285 225 250 228 Q 215 225 210 205 Z" fill="#0F172A" opacity="0.85"/>
  <circle cx="230" cy="212" r="4" fill="#00F5D4" />
  <circle cx="270" cy="212" r="4" fill="#FF007A" />

  <!-- Avatar Torso/Hoodie -->
  <path d="M 175 345 C 175 285, 215 275, 250 275 C 285 275, 325 285, 325 345 Z" fill="#FFFFFF" />

  <!-- Gen Z Branding Elements: Sparkles / AI Magic Icons -->
  <!-- Primary Star Burst -->
  <path d="M 370 120 L 380 145 L 405 155 L 380 165 L 370 190 L 360 165 L 335 155 L 360 145 Z" fill="url(#starGlow)" />
  <!-- Secondary Sparkle -->
  <path d="M 120 330 L 126 345 L 141 351 L 126 357 L 120 372 L 114 357 L 99 351 L 114 345 Z" fill="#00F5D4" />
  
  <!-- Subtle Aperture Ring Highlight -->
  <circle cx="250" cy="250" r="190" stroke="url(#neonPulse)" stroke-width="2" fill="none" stroke-opacity="0.25" stroke-dasharray="6 12"/>
</svg>
